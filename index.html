<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314161b'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23f5c518' font-family='sans-serif'%3E%E5%90%9B%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-title" content="君意·学习空间">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>君意 · 学习空间</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 40px}
.hero{text-align:center;padding:26px 0 30px}
.hero .hi{font-size:15px;color:var(--muted);letter-spacing:.5px;margin-bottom:10px}
.hero h1{margin:0;font-size:30px;letter-spacing:1px;line-height:1.25}
.hero h1 b{color:var(--yellow)}
.hero p{margin:12px 0 0;color:var(--dim);font-size:14px;line-height:1.7}
.clock{margin-top:14px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:8px}
.app{position:relative;display:block;background:var(--panel);border:1px solid var(--border);border-radius:20px;
  padding:24px 22px;color:var(--text);text-decoration:none;overflow:hidden;
  transition:transform .18s,border-color .18s,background .18s}
.app:hover{transform:translateY(-3px);border-color:#3d4454;background:#1e222a}
.app:active{transform:scale(.985)}
.app .glow{position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-70px;filter:blur(42px);opacity:.30;pointer-events:none}
.app .ico{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.app .ico svg{width:34px;height:34px;display:block}
.app h2{margin:0 0 6px;font-size:20px;letter-spacing:.6px}
.app p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.65}
.app .tags{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.app .tags span{font-size:11.5px;color:#a8b2c4;background:var(--panel2);border-radius:20px;padding:4px 9px}
.app .go{position:absolute;right:20px;bottom:20px;color:var(--dim);font-size:20px;transition:.18s}
.app:hover .go{color:var(--yellow);transform:translateX(3px)}

.ico.dict{background:linear-gradient(140deg,#f5c518,#e0900c)}
.ico.ai{background:linear-gradient(140deg,#5b8cff,#8b5cf6)}
.ico.dict svg{color:#1a1400}
.ico.ai svg{color:#fff}
.glow.dict{background:#f5c518}
.glow.ai{background:#7c5cff}

.foot{margin-top:34px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.9}
.foot b{color:#a8b2c4;font-weight:600}

@media (max-width:520px){
  .wrap{padding:18px 14px 32px}
  .hero{padding:14px 0 22px}
  .hero h1{font-size:25px}
  .grid{grid-template-columns:1fr;gap:13px}
  .app{padding:20px 18px;border-radius:18px}
  .app .ico{width:56px;height:56px;border-radius:16px;margin-bottom:12px}
  .app .ico svg{width:30px;height:30px}
  .app h2{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="hi" id="hello">你好</div>
    <h1>君意 · <b>学习空间</b></h1>
    <p>选一个功能开始吧</p>
    <div class="clock" id="clock"></div>
  </div>

  <div class="grid">

    <a class="app" href="dictation.html">
      <div class="glow dict"></div>
      <div class="ico dict">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10v4a2 2 0 0 0 2 2h1V8H5a2 2 0 0 0-2 2z"/>
          <path d="M18 8v8h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-1z"/>
          <path d="M6 8v8a6 6 0 0 0 6 6"/>
          <circle cx="17" cy="18" r="3"/>
        </svg>
      </div>
      <h2>听写助手</h2>
      <p>词表生成卡片，语音逐词听写，遮挡答案、自动下一个</p>
      <div class="tags"><span>微软在线语音</span><span>本地语音</span><span>听写记录</span></div>
      <span class="go">›</span>
    </a>

    <a class="app" href="ai.html">
      <div class="glow ai"></div>
      <div class="ico ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>
          <path d="M9 11h.01M13 11h.01M17 11h.01"/>
        </svg>
      </div>
      <h2>AI 老师</h2>
      <p>像老师一样讲题：能发图片和文字，一步步讲到你会为止</p>
      <div class="tags"><span>讲题</span><span>拍照提问</span><span>可换模型</span></div>
      <span class="go">›</span>
    </a>

  </div>

  <div class="foot">
    所有<b>设置与对话记录</b>只保存在你自己的浏览器里，不会上传到任何服务器<br>
    <span style="opacity:.7">建议用 Chrome / Edge 打开，效果最好</span>
  </div>

</div>

<div id="toast"></div>

<script>
"use strict";
(function(){
  function $(id){ return document.getElementById(id); }

  var h = new Date().getHours();
  var hello = "你好";
  if(h >= 5 && h < 11) hello = "早上好";
  else if(h >= 11 && h < 13) hello = "中午好";
  else if(h >= 13 && h < 18) hello = "下午好";
  else if(h >= 18 && h < 23) hello = "晚上好";
  else hello = "夜深了，注意休息";
  $("hello").textContent = hello;

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function tick(){
    var d = new Date();
    var w = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
    $("clock").textContent = d.getMonth()+1 + "月" + d.getDate() + "日 " + w + " " +
      pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 20000);

  // 记录最近打开，返回首页时高亮（轻量，不影响使用）
  try{ localStorage.setItem("jy_last_home_v1", String(Date.now())); }catch(e){}
})();
</script>
</body>
</html>
